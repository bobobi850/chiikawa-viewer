name: Update episode catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U yt-dlp
      - run: python scripts/update_episodes.py
      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh sorted episode catalog"
            git push
          fi
