<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>치이카와 뷰어</title>
<style>
:root{font-family:system-ui,sans-serif;color:#443d46;background:#fff8f7}*{box-sizing:border-box}body{margin:0}header{padding:18px max(18px,calc((100% - 1100px)/2));background:white;border-bottom:1px solid #f3dbe5;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0;color:#d75e94}main{max-width:1100px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:20px}.panel{background:white;border:1px solid #f2dfe7;border-radius:18px;padding:18px;box-shadow:0 5px 20px #f6dce64d}.video{aspect-ratio:16/9;background:#28232b;border-radius:12px;overflow:hidden}.video iframe{width:100%;height:100%;border:0}button,input{font:inherit}button{border:0;background:#f9dce9;color:#853a5d;border-radius:10px;padding:9px 12px;cursor:pointer}button.primary{background:#d75e94;color:white}button:disabled{opacity:.4}button:hover{filter:brightness(.96)}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}.muted{color:#81777f;font-size:13px}.list{max-height:500px;overflow:auto;display:grid;gap:6px}.episode{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;background:#fff7fa}.episode.active{background:#f8d3e3;font-weight:700}.episode span{flex:1}.settings{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}a{color:#b4477a}#status{min-height:20px}#empty{padding:12px;color:#8a6979}.search{width:100%;padding:12px;border:1px solid #ead2df;border-radius:10px;margin:0 0 12px}.episode span{min-width:0;overflow-wrap:anywhere}.episode b{margin-left:8px} @media(max-width:760px){main{grid-template-columns:1fr;margin:12px auto}.panel{padding:12px}header{padding:14px}}
</style></head><body><header><h1>♡ 치이카와 뷰어</h1><span class="muted">에피소드 연속 재생</span></header>
<main><section class="panel"><div class="video" id="player"></div><h2 id="title">플레이리스트 불러오는 중…</h2><p class="muted" id="status">YouTube 플레이어 연결 중</p><div class="controls"><button id="prev">◀ 이전 화</button><button class="primary" id="next">다음 화 ▶</button><button id="favorite">☆ 즐겨찾기</button><button id="share">🔗 현재 화 공유</button><button id="resume">이어보기</button></div><div class="settings"><label><input type="checkbox" id="autoskip" checked> 아웃트로 자동 넘기기</label><span class="muted">아웃트로 30초 고정</span><label><input type="checkbox" id="favoritesOnly"> 즐겨찾기만 보기</label></div><p class="muted">중복 회차를 제외하고 회차 순서대로 재생합니다. 재생 기록과 즐겨찾기는 현재 브라우저에 저장됩니다. 모바일 환경에서는 자동 재생이 제한될 수 있습니다.</p><p><a href="https://www.youtube.com/playlist?list=PLsmaUhkCwW3q5q46uc9So2b4D-pZqVZOV" target="_blank" rel="noopener">유튜브 원본 플레이리스트 열기</a></p></section><aside class="panel"><h2>에피소드 목록</h2><input id="search" class="search" type="search" placeholder="제목 또는 회차 검색" aria-label="에피소드 검색"><p class="muted" id="count">목록 확인 중…</p><div class="list" id="episodes"><div id="empty">YouTube 목록을 불러오는 중입니다.</div></div></aside></main>
<script>
const LIST='PLsmaUhkCwW3q5q46uc9So2b4D-pZqVZOV',KEY='chiikawa-viewer-v2';
const $=id=>document.getElementById(id);
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
const favorites=new Set(saved.favorites||[]),watched=new Set(saved.watched||[]);
const state={episodes:[],index:0,player:null,transition:false,lastPosition:0,ready:false,mode:'catalog'};
const clean=t=>(t||'').replace(/^\s*\[전편공개\]\s*먼작귀\s*\(먼가 작고 귀여운 녀석\)\s*/u,'').replace(/^[-–|:\s]+/,'').trim();
const number=t=>{const m=(t||'').match(/(?:^|\D)(\d{1,4})\s*화/);return m?Number(m[1]):null};
const id=()=>state.episodes[state.index]?.id||'';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({favorites:[...favorites],watched:[...watched],id:id(),position:state.lastPosition,autoskip:$('autoskip').checked}))}catch{}};
const status=t=>$('status').textContent=t;
$('autoskip').checked=saved.autoskip!==false;
function prepare(items){
 const seenId=new Set(),seenEp=new Set(),out=[];
 for(const x of items){
  if(!x||!/^[\w-]{11}$/.test(x.id)||seenId.has(x.id))continue;
  seenId.add(x.id);
  const title=clean(x.title)||'제목 미확인',ep=Number.isInteger(x.episode)?x.episode:number(title);
  if(ep!==null){if(seenEp.has(ep))continue;seenEp.add(ep)}
  out.push({id:x.id,title,episode:ep,sourceOrder:x.sourceOrder??out.length});
 }
 out.sort((a,b)=>(a.episode===null)-(b.episode===null)||(a.episode??a.sourceOrder)-(b.episode??b.sourceOrder)||a.sourceOrder-b.sourceOrder);
 return out;
}
function draw(){
 const box=$('episodes');box.replaceChildren();const term=$('search').value.trim().toLocaleLowerCase();
 $('count').textContent=state.episodes.length+'개 영상'+(state.mode==='fallback'?' · 일부만 표시될 수 있음':'');
 state.episodes.forEach((e,i)=>{
  if($('favoritesOnly').checked&&!favorites.has(e.id))return;
  if(term&&!((e.title+' '+(e.episode===null?'':'EP '+e.episode)).toLocaleLowerCase().includes(term)))return;
  const b=document.createElement('button');b.className='episode'+(i===state.index?' active':'');
  const label=document.createElement('span');label.textContent=(watched.has(e.id)?'✓ ':'')+e.title;
  const star=document.createElement('b');star.textContent=favorites.has(e.id)?'★':'☆';
  b.append(label,star);b.onclick=()=>go(i);box.append(b);
 });
 if(!box.children.length)box.textContent='검색 결과가 없습니다.';
 const e=state.episodes[state.index];
 $('title').textContent=e?'치이카와 · '+e.title:'영상 목록 불러오는 중…';
 $('favorite').textContent=favorites.has(id())?'★ 즐겨찾기 해제':'☆ 즐겨찾기';
 $('prev').disabled=state.index===0;$('next').disabled=state.index>=state.episodes.length-1;
}
function chooseStart(){
 const q=new URLSearchParams(location.search),requested=q.get('v');
 const found=state.episodes.findIndex(e=>e.id===(requested||saved.id));
 const ep=Number(q.get('episode'));
 const byEpisode=Number.isInteger(ep)&&ep>0?state.episodes.findIndex(e=>e.episode===ep):-1;
 state.index=found>=0?found:byEpisode>=0?byEpisode:0;draw();
}
function go(i){
 if(!state.ready||!state.episodes.length)return;
 const target=Math.max(0,Math.min(i,state.episodes.length-1));
 state.transition=true;state.index=target;state.lastPosition=0;
 state.player.loadVideoById(id());save();draw();
 setTimeout(()=>state.transition=false,1200);
}
function next(){if(state.index<state.episodes.length-1)go(state.index+1);else{status('마지막 에피소드입니다.');state.player.pauseVideo()}}
$('prev').onclick=()=>go(state.index-1);$('next').onclick=next;
$('favorite').onclick=()=>{if(!id())return;favorites.has(id())?favorites.delete(id()):favorites.add(id());save();draw()};
$('share').onclick=async()=>{const u=new URL(location.href);u.searchParams.delete('episode');u.searchParams.set('v',id());try{await navigator.clipboard.writeText(u.toString());status('회차 링크를 복사했습니다.')}catch{prompt('공유할 주소',u.toString())}};
$('resume').onclick=()=>{const i=state.episodes.findIndex(e=>e.id===saved.id);if(i<0)return status('이어볼 영상이 없습니다.');go(i);setTimeout(()=>{if(saved.position>0)state.player.seekTo(saved.position,true)},1600)};
$('favoritesOnly').onchange=draw;$('search').oninput=draw;$('autoskip').onchange=save;
function tick(){
 const p=state.player;if(!state.ready||!state.episodes.length||state.transition)return;
 try{
  if(p.getPlayerState()!==YT.PlayerState.PLAYING)return;
  const actual=p.getVideoData()?.video_id;
  if(actual&&actual!==id())return;
  const d=p.getDuration(),t=p.getCurrentTime();
  if(d>0&&t>=0){state.lastPosition=t;if(Math.floor(t)%5===0)save();
   if($('autoskip').checked&&d>33&&t>=d-30){watched.add(id());save();next()}
  }
 }catch(e){status('재생 상태 확인 실패')}
}
async function catalog(){
 try{
  const response=await fetch('./episodes.json',{cache:'no-store'});
  if(!response.ok)throw Error('not published');
  const data=await response.json();
  if(!Array.isArray(data)||!data.length)throw Error('empty');
  state.episodes=prepare(data);state.mode='catalog';chooseStart();return true;
 }catch{return false}
}
let apiReady=false,listingReady=false;
function initialize(){
 if(!apiReady||!listingReady||state.player)return;
 state.player=new YT.Player('player',{height:'390',width:'640',videoId:id(),playerVars:{playsinline:1,origin:location.origin},events:{
  onReady:()=>{state.ready=true;status(state.mode==='catalog'?'회차를 선택하거나 재생 버튼을 누르세요.':'일부 영상만 불러왔습니다. 전체 목록 업데이트가 필요합니다.');setInterval(tick,500)},
  onStateChange:e=>{if(e.data===YT.PlayerState.ENDED){watched.add(id());save();next()}},
  onError:e=>status('유튜브 재생 오류 ('+e.data+')')
 }});
}
window.onYouTubeIframeAPIReady=()=>{apiReady=true;initialize()};
(async()=>{
 if(!(await catalog())){
  state.mode='fallback';
  status('전체 목록 생성 전입니다. 임시 재생목록을 불러옵니다.');
  // Fallback uses the YouTube playlist API, which can be incomplete.
  const probe=new YT.Player(document.createElement('div'),{playerVars:{listType:'playlist',list:LIST},events:{onReady:e=>e.target.cuePlaylist({listType:'playlist',list:LIST,index:1}),onStateChange:e=>{
   const ids=e.target.getPlaylist()||[];
   if(ids.length&&!listingReady){
    state.episodes=prepare(ids.slice(1).map((v,i)=>({id:v,title:'영상 '+(i+1),sourceOrder:i})));
    chooseStart();listingReady=true;initialize();
   }
  }}});
  // The catalog workflow must run for complete episode ordering.
 }else{listingReady=true;initialize()}
})();
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.append(script);
</script></body></html>
