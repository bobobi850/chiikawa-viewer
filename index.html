<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>치이카와 뷰어</title>
<style>
:root{font-family:system-ui,sans-serif;color:#443d46;background:#fff8f7}*{box-sizing:border-box}body{margin:0}header{padding:18px max(18px,calc((100% - 1100px)/2));background:white;border-bottom:1px solid #f3dbe5;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0;color:#d75e94}main{max-width:1100px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:20px}.panel{background:white;border:1px solid #f2dfe7;border-radius:18px;padding:18px;box-shadow:0 5px 20px #f6dce64d}.video{aspect-ratio:16/9;background:#28232b;border-radius:12px;overflow:hidden}.video iframe{width:100%;height:100%;border:0}button,input{font:inherit}button{border:0;background:#f9dce9;color:#853a5d;border-radius:10px;padding:9px 12px;cursor:pointer}button.primary{background:#d75e94;color:white}button:disabled{opacity:.4}button:hover{filter:brightness(.96)}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}.muted{color:#81777f;font-size:13px}.list{max-height:500px;overflow:auto;display:grid;gap:6px}.episode{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;background:#fff7fa}.episode.active{background:#f8d3e3;font-weight:700}.episode span{flex:1}.settings{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}a{color:#b4477a}#status{min-height:20px}#empty{padding:12px;color:#8a6979} @media(max-width:760px){main{grid-template-columns:1fr;margin:12px auto}.panel{padding:12px}header{padding:14px}}
</style></head><body><header><h1>♡ 치이카와 뷰어</h1><span class="muted">에피소드 연속 재생</span></header>
<main><section class="panel"><div class="video" id="player"></div><h2 id="title">플레이리스트 불러오는 중…</h2><p class="muted" id="status">YouTube 플레이어 연결 중</p><div class="controls"><button id="prev">◀ 이전 화</button><button class="primary" id="next">다음 화 ▶</button><button id="favorite">☆ 즐겨찾기</button><button id="share">🔗 현재 화 공유</button><button id="resume">이어보기</button></div><div class="settings"><label><input type="checkbox" id="autoskip" checked> 아웃트로 자동 넘기기</label><span class="muted">아웃트로 30초 고정</span><label><input type="checkbox" id="favoritesOnly"> 즐겨찾기만 보기</label></div><p class="muted">첫 번째 영상은 제외합니다. 재생 기록과 즐겨찾기는 현재 브라우저에 저장됩니다. 모바일 환경에서는 자동 재생이 제한될 수 있습니다.</p><p><a href="https://www.youtube.com/playlist?list=PLsmaUhkCwW3q5q46uc9So2b4D-pZqVZOV" target="_blank" rel="noopener">유튜브 원본 플레이리스트 열기</a></p></section><aside class="panel"><h2>에피소드 목록</h2><p class="muted" id="count">목록 확인 중…</p><div class="list" id="episodes"><div id="empty">YouTube 목록을 불러오는 중입니다.</div></div></aside></main>
<script>
const LIST='PLsmaUhkCwW3q5q46uc9So2b4D-pZqVZOV', KEY='chiikawa-viewer-v1';
const $=id=>document.getElementById(id);
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
const state={index:1,ids:[],player:null,transition:false,previousVideo:'',lastPosition:0};
const favorites=new Set(saved.favorites||[]),watched=new Set(saved.watched||[]);
$('autoskip').checked=saved.autoskip!==false;
function persist(){localStorage.setItem(KEY,JSON.stringify({favorites:[...favorites],watched:[...watched],index:state.index,position:state.lastPosition,autoskip:$('autoskip').checked}))}
function status(t){$('status').textContent=t}
function currentId(){return state.ids[state.index]||''}
function draw(){const box=$('episodes');box.replaceChildren();$('count').textContent=state.ids.length?state.ids.length-1+'개 영상 (첫 영상 제외)':'목록을 불러오는 중…';state.ids.forEach((id,i)=>{if(i===0||($('favoritesOnly').checked&&!favorites.has(id)))return;const b=document.createElement('button');b.className='episode'+(i===state.index?' active':'');const s=document.createElement('span');s.textContent=(watched.has(id)?'✓ ':'')+'EP '+String(i).padStart(2,'0');const star=document.createElement('b');star.textContent=favorites.has(id)?'★':'☆';b.append(s,star);b.onclick=()=>go(i);box.append(b)});if(!box.children.length)box.textContent='표시할 회차가 없습니다.';$('favorite').textContent=favorites.has(currentId())?'★ 즐겨찾기 해제':'☆ 즐겨찾기';$('title').textContent='치이카와 · EP '+String(state.index).padStart(2,'0');$('prev').disabled=state.index<=1;$('next').disabled=state.index>=state.ids.length-1}
function go(i){if(!state.player||!state.ids.length)return;const target=Math.max(1,Math.min(i,state.ids.length-1));state.transition=true;state.index=target;state.lastPosition=0;state.player.playVideoAt(target);setTimeout(()=>state.transition=false,1500);persist();draw()}
function next(){if(state.index<state.ids.length-1)go(state.index+1);else{status('마지막 에피소드입니다.');state.player.pauseVideo()}}
$('prev').onclick=()=>go(state.index-1);$('next').onclick=next;
$('favorite').onclick=()=>{const id=currentId();if(!id)return;favorites.has(id)?favorites.delete(id):favorites.add(id);persist();draw()};
$('share').onclick=async()=>{const url=new URL(location.href);url.searchParams.set('episode',state.index);try{await navigator.clipboard.writeText(url.toString());status('회차 링크를 복사했습니다.')}catch{prompt('공유할 주소',url.toString())}};
$('resume').onclick=()=>{go(saved.index||1);setTimeout(()=>{if(saved.position>0)state.player.seekTo(saved.position,true)},1800)};
$('favoritesOnly').onchange=draw;$('autoskip').onchange=persist;
function tick(){const p=state.player;if(!p||!state.ids.length||state.transition)return;try{if(p.getPlayerState()!==YT.PlayerState.PLAYING)return;const idx=p.getPlaylistIndex();if(idx===0){go(1);return}if(idx>=1&&idx!==state.index){state.index=idx;draw()}const d=p.getDuration(),t=p.getCurrentTime(),outro=30;if(d>0&&t>0){state.lastPosition=t;if(Math.floor(t)%5===0)persist();if($('autoskip').checked&&outro>0&&d>outro+3&&t>=d-outro){watched.add(currentId());persist();next()}}}catch(e){status('재생 상태 확인 실패: '+e.message)}}
window.onYouTubeIframeAPIReady=function(){state.player=new YT.Player('player',{height:'390',width:'640',playerVars:{playsinline:1,origin:location.origin},events:{onReady:e=>{e.target.cuePlaylist({listType:'playlist',list:LIST,index:1});status('재생 버튼을 눌러 시작하세요.');setInterval(tick,500)},onStateChange:e=>{const p=state.player;if(!p)return;const ids=p.getPlaylist()||[];if(ids.length&&ids.join('|')!==state.ids.join('|')){state.ids=ids;const q=Number(new URLSearchParams(location.search).get('episode'));const start=q>=1?q:(saved.index>=1?saved.index:1);state.index=Math.min(start,ids.length-1);draw();if(state.index!==1)p.cuePlaylist({listType:'playlist',list:LIST,index:state.index})}if(e.data===YT.PlayerState.ENDED){watched.add(currentId());persist();if(state.index<state.ids.length-1)next()}},onError:e=>status('유튜브 재생 오류 ('+e.data+'). 외부 재생 제한 여부를 확인하세요.')}})};
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.append(script);
</script></body></html>
